[package]
name = "island-windows"
description = "The island as a native Windows app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "island"
path = "src/main.rs"

[dependencies]
island-core = { path = "../../crates/island-core" }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm","Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Graphics_DirectWrite", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
windows-numerics = "0.3"

[lints]
workspace = true
