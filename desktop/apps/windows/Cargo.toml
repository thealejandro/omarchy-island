[package]
name = "island-windows"
description = "The island as a native Windows app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "island"
path = "src/main.rs"

[build-dependencies]
# The exe's icon is drawn by the core's code.
island-core = { path = "../../crates/island-core" }
# Puts the icon and the version into the exe (rc.exe, or llvm-rc/windres).
embed-resource = "3"

[features]
# Visual QA: `island.exe --qa casos.txt` (see src/qa.rs). Never in a release.
qa = []

[dependencies]
island-core = { path = "../../crates/island-core" }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm","Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Graphics_DirectWrite", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Devices_Enumeration", "Win32_UI_Accessibility", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation_Collections"] }
windows-numerics = "0.3"
# The `implement` macro (Core Audio's callbacks) names it.
windows-core = "0.62.2"
# WinRT's lists and maps (the Bluetooth watcher's properties).
windows-collections = "0.3.2"

[lints]
workspace = true
