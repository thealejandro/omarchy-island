[package]
name = "island-core"
description = "Platform-neutral logic of the island: lyrics, texts and settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# regex-lite: small and enough here (the patterns' keywords are ASCII).
regex-lite = "0.1"
# preserve_order: settings.json keeps its keys where the user put them.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
