name: desktop

on:
  push:
    branches: [main]
    tags: ['windows-v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p island-windows

  # A `windows-vX.Y.Z` tag: the exe goes to a GitHub Release of its own, never
  # marked Latest (that one is the Omarchy plugin's).
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Only what was merged: never a tag on a branch nobody reviewed.
      - name: The tagged commit is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "$env:GITHUB_SHA is not on main"
          }
      - name: The tag is the version in Cargo.toml
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.Substring("windows-v".Length)
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "The tag says $tag, Cargo.toml says $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: cargo build --release -p island-windows --locked
      - name: The exe and its checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Island-$env:VERSION-x64.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/island.exe "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: desktop/dist/Island-*.exe
      - name: The release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          gh release create $env:TAG (Get-ChildItem dist/*).FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title "Island $v for Windows" `
            --notes "Island $v for Windows 10 and 11 (x64). Download Island-$v-x64.exe and open it: it offers to install itself, or to update an older one. SHA256SUMS.txt has its checksum." `
            --latest=false
